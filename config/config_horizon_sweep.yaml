# =====================================================================
# Horizon consensus-threshold sweep (SLX-27639, standard hybridisation)
# Reuses the UMI-grouped BAMs from the legacy shell run, calls consensus
# once permissively and filters at 6-3-3 / 4-2-2 / 3-2-1 / 2-1-1.
#
#   snakemake -s workflow/Snakefile --configfile config/config.local.yaml config/config_horizon_sweep.yaml \
#             --use-conda --conda-frontend conda --cores 32
# Later files override earlier ones: config.yaml < config.local.yaml < this file.
# =====================================================================

samples_tsv: "config/samples_horizon.tsv"
results_dir: "/powervault/zuzanna/horizon_legacy_duplex/snakemake_consensus_sweep"
run_name: "horizon_consensus_sweep"

existing_grouped_bam: "/powervault/zuzanna/horizon_legacy_duplex/standard_hybridisation/{sample_udi}/{sample}_UMI_grouped.bam"

# Paths (reference, BED, jars, ANNOVAR) are NOT set here: they come from your
# server-only config/config.local.yaml (not in git). Run with:
#   --configfile config/config.local.yaml config/config_horizon_sweep.yaml

consensus:
  call_min_reads_sscs: 1
  call_min_reads_duplex: "1 1 0"
  base_qual_min: 20
  cons_qual_min: 45
  max_base_error_rate: 0.2
  clip_bases: 3

filter_settings:
  "6-3-3": {duplex: "6 3 3", sscs: 3}
  "4-2-2": {duplex: "4 2 2", sscs: 2}
  "3-2-1": {duplex: "3 2 1", sscs: 1}
  "2-1-1": {duplex: "2 1 1", sscs: 1}   # added for the Phase 1 report (SSCS identical to 3-2-1)

threads: 8
java_xmx: "16G"
